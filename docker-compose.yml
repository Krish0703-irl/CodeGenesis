services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
